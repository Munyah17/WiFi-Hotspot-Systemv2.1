<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cashier — WiFi Cafe</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">
  <div class="max-w-lg mx-auto px-4 py-6">
    <h1 class="text-xl font-bold mb-4">Cashier</h1>

    <div id="login-box" class="bg-white rounded-xl p-4 shadow-sm space-y-3">
      <input id="login-phone" placeholder="Phone number" class="w-full border rounded-lg px-3 py-2" />
      <input id="login-password" type="password" placeholder="Password" class="w-full border rounded-lg px-3 py-2" />
      <button id="login-btn" class="w-full py-2 rounded-lg bg-slate-900 text-white font-medium">Log In</button>
      <p id="login-error" class="text-sm text-red-600"></p>
    </div>

    <div id="app-box" class="hidden space-y-4">
      <div class="bg-white rounded-xl p-4 shadow-sm">
        <h2 class="font-semibold mb-2">Sell a Voucher (Cash)</h2>
        <div id="packages" class="space-y-2"></div>
      </div>

      <div id="receipt" class="hidden bg-white rounded-xl p-4 shadow-sm text-center space-y-1 font-mono text-sm">
        <p class="font-bold text-lg" id="receipt-code"></p>
        <p id="receipt-package"></p>
        <p id="receipt-price"></p>
        <button onclick="window.print()" class="mt-3 w-full py-2 rounded-lg bg-slate-900 text-white font-sans">Print Receipt</button>
      </div>

      <div class="bg-white rounded-xl p-4 shadow-sm">
        <h2 class="font-semibold mb-2">Recent Sales</h2>
        <div id="recent" class="text-sm space-y-1"></div>
      </div>
    </div>
  </div>
  <script src="/js/cashier.js"></script>
</body>
</html>
